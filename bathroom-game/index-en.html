<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="screen-orientation" content="portrait" />
<meta name="x5-orientation" content="portrait" />
<title>💩 Poop Catch</title>
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #2b2140;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    touch-action: none;
    user-select: none;
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* Force a portrait layout even if the device is physically rotated to
     landscape (common on Android when auto-rotate is on). Rotates the
     whole page -90deg and re-maps the viewport so it still fills the
     screen as portrait, without needing the Fullscreen/Orientation APIs. */
  @media screen and (orientation: landscape) {
    html {
      transform: rotate(-90deg);
      transform-origin: left top;
      width: 100vh;
      height: 100vw;
      overflow: hidden;
      position: absolute;
      top: 100%;
      left: 0;
    }
  }
  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 560px;
    margin: 0 auto;
    background: linear-gradient(180deg, #4b3b74 0%, #2f2450 60%, #1f1836 100%);
    overflow: hidden;
  }
  /* Falling items and the toilet are plain DOM elements (not canvas).
     Many Android browsers don't render color emoji glyphs inside
     <canvas> fillText and silently fall back to a near-invisible
     monochrome silhouette; regular text/DOM rendering always uses the
     system's real color emoji font, so it works everywhere. */
  #playfield {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    overflow: hidden;
    pointer-events: none;
    background-image: repeating-linear-gradient(
      rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 1px,
      transparent 1px, transparent 40px
    );
  }
  .item {
    position: absolute;
    left: 0;
    top: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    will-change: transform;
  }
  .particle {
    position: absolute;
    left: 0;
    top: 0;
    line-height: 1;
    pointer-events: none;
    will-change: transform, opacity;
  }
  #playerEl {
    position: absolute;
    left: 0;
    top: 0;
    width: 62px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    line-height: 1;
    will-change: transform;
  }
  #comboEl {
    position: absolute;
    left: 0;
    top: 0;
    transform: translate(-50%, -100%);
    color: #ffe066;
    font-weight: 900;
    font-size: 14px;
    white-space: nowrap;
    text-shadow: 0 2px 4px rgba(0,0,0,.5);
    z-index: 6;
  }
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px 0;
    pointer-events: none;
    z-index: 5;
  }
  #score {
    color: #fff;
    font-size: 22px;
    font-weight: 800;
    text-shadow: 0 2px 4px rgba(0,0,0,.4);
  }
  #best {
    color: #ffd66b;
    font-size: 13px;
    font-weight: 600;
    margin-top: 2px;
  }
  #lives {
    font-size: 22px;
    letter-spacing: 2px;
    text-shadow: 0 2px 4px rgba(0,0,0,.4);
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(20, 14, 36, 0.72);
    backdrop-filter: blur(2px);
    text-align: center;
    padding: 24px;
    z-index: 10;
  }
  .hidden { display: none !important; }
  .title {
    font-size: 40px;
    line-height: 1.2;
    color: #fff;
    font-weight: 900;
    text-shadow: 0 4px 10px rgba(0,0,0,.4);
  }
  .sub {
    color: #e8def8;
    font-size: 15px;
    max-width: 320px;
    line-height: 1.6;
  }
  .bigScore {
    color: #ffd66b;
    font-size: 46px;
    font-weight: 900;
  }
  .label {
    color: #c9b8ec;
    font-size: 13px;
  }
  button {
    margin-top: 6px;
    border: none;
    outline: none;
    cursor: pointer;
    background: linear-gradient(180deg, #ffcf5c, #ffab3d);
    color: #5a3200;
    font-weight: 800;
    font-size: 18px;
    padding: 14px 34px;
    border-radius: 999px;
    box-shadow: 0 6px 0 #b6741a, 0 10px 18px rgba(0,0,0,.35);
    transition: transform .05s ease;
  }
  button:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #b6741a, 0 4px 10px rgba(0,0,0,.35);
  }
  #footer-note {
    position: absolute;
    bottom: 8px;
    width: 100%;
    text-align: center;
    color: rgba(255,255,255,0.35);
    font-size: 11px;
    z-index: 5;
    pointer-events: none;
  }
  #controlBar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: calc(92px + env(safe-area-inset-bottom, 0px));
    padding: 0 0 calc(14px + env(safe-area-inset-bottom, 0px));
    z-index: 8;
    touch-action: none;
  }
  #controlTrack {
    position: relative;
    width: 100%;
    height: 100%;
    background: rgba(255,255,255,0.08);
    border-top: 2px solid rgba(255,255,255,0.18);
    box-sizing: border-box;
  }
  #controlThumb {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 60px;
    height: 60px;
    margin-left: -30px;
    margin-top: -30px;
    border-radius: 50%;
    background: linear-gradient(180deg, #ffcf5c, #ffab3d);
    box-shadow: 0 4px 0 #b6741a, 0 8px 14px rgba(0,0,0,.35);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div id="playfield">
      <div id="playerEl">🚽</div>
      <div id="comboEl"></div>
    </div>

    <div id="hud">
      <div>
        <div id="score">0</div>
        <div id="best">Best 0</div>
      </div>
      <div id="lives">🧻🧻🧻</div>
    </div>

    <div id="startScreen" class="overlay">
      <div class="title">💩 Poop<br/>Catch</div>
      <div class="sub">
        Catch falling <b>💩</b> with your toilet to score!<br/>
        Dodge <b>🦠 germs</b>, and grab <b>🧻</b> to heal!<br/>
        Drag the bar at the bottom to move.
      </div>
      <button id="startBtn">Start</button>
      <div class="label" id="bestLabel">Best score 0</div>
    </div>

    <div id="overScreen" class="overlay hidden">
      <div class="title" style="font-size:28px;">💩 Flushed!</div>
      <div class="bigScore" id="finalScore">0</div>
      <div class="label" id="newBest"></div>
      <button id="retryBtn">Play Again</button>
    </div>

    <div id="footer-note">Drag the bar below to move</div>

    <div id="controlBar">
      <div id="controlTrack">
        <div id="controlThumb">🚽</div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const stage = document.getElementById('stage');
  const playfield = document.getElementById('playfield');
  const playerEl = document.getElementById('playerEl');
  const comboEl = document.getElementById('comboEl');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const bestLabel = document.getElementById('bestLabel');
  const livesEl = document.getElementById('lives');
  const startScreen = document.getElementById('startScreen');
  const overScreen = document.getElementById('overScreen');
  const finalScoreEl = document.getElementById('finalScore');
  const newBestEl = document.getElementById('newBest');
  const startBtn = document.getElementById('startBtn');
  const retryBtn = document.getElementById('retryBtn');
  const controlBar = document.getElementById('controlBar');
  const controlThumb = document.getElementById('controlThumb');

  let BAR_H = 92; // reserved height for the bottom control bar (recomputed on resize)

  const BEST_KEY = 'poopCatchBest';
  let best = Number(localStorage.getItem(BEST_KEY) || 0);
  bestEl.textContent = 'Best ' + best;
  bestLabel.textContent = 'Best score ' + best;

  let W, H;
  function resize() {
    W = stage.clientWidth;
    H = stage.clientHeight;
    BAR_H = controlBar.getBoundingClientRect().height || BAR_H;
    playfield.style.width = W + 'px';
    playfield.style.height = Math.max(0, H - BAR_H) + 'px';
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 50));
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resize);
  }
  resize();

  const ITEM_TYPES = {
    poop:  { emoji: '💩', score: 10, weight: 54 },
    paper: { emoji: '🧻', score: 5,  weight: 13, heal: true },
    star:  { emoji: '⭐', score: 40, weight: 7  },
    bug:   { emoji: '🦠', score: 0,  weight: 26, bad: true },
  };
  const TYPE_LIST = Object.keys(ITEM_TYPES);

  function pickType() {
    const totalWeight = TYPE_LIST.reduce((s, k) => s + ITEM_TYPES[k].weight, 0);
    let r = Math.random() * totalWeight;
    for (const k of TYPE_LIST) {
      r -= ITEM_TYPES[k].weight;
      if (r <= 0) return k;
    }
    return TYPE_LIST[0];
  }

  let player, items, score, lives, combo, comboTimer, elapsed, spawnTimer, spawnInterval, fallSpeed, running, dragX;

  function resetGame() {
    player = { x: W / 2, y: H - BAR_H - 46 - 14, w: 62, h: 46, targetX: W / 2 };
    items.forEach(it => it.el.remove());
    items = [];
    score = 0;
    lives = 3;
    combo = 0;
    comboTimer = 0;
    elapsed = 0;
    spawnTimer = 0;
    spawnInterval = 0.95;
    fallSpeed = 150;
    running = true;
    dragX = player.x;
    comboEl.textContent = '';
    updateHud();
  }

  function updateHud() {
    scoreEl.textContent = score;
    let heartsStr = '';
    for (let i = 0; i < 3; i++) heartsStr += i < lives ? '🧻' : '⬜';
    livesEl.textContent = heartsStr;
  }

  function spawnItem() {
    const type = pickType();
    const def = ITEM_TYPES[type];
    const size = 34 + Math.random() * 10;
    const el = document.createElement('div');
    el.className = 'item';
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.fontSize = size + 'px';
    el.textContent = def.emoji;
    playfield.appendChild(el);
    items.push({
      type, def, el,
      x: 24 + Math.random() * (W - 48),
      y: -size,
      size,
      vy: fallSpeed * (0.85 + Math.random() * 0.4),
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 2,
    });
  }

  // One-shot catch/miss effects, animated with the Web Animations API so
  // they clean themselves up (no manual per-frame particle bookkeeping,
  // and it's real DOM text so emoji always render in color).
  function burst(x, y, emoji, count) {
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'particle';
      el.style.fontSize = (14 + Math.random() * 10) + 'px';
      el.textContent = emoji;
      playfield.appendChild(el);
      const dx = (Math.random() - 0.5) * 90;
      const dy = -(Math.random() * 80 + 20);
      el.style.transform = `translate(${x}px, ${y}px)`;
      const anim = el.animate([
        { transform: `translate(${x}px, ${y}px)`, opacity: 1 },
        { transform: `translate(${x + dx}px, ${y + dy}px)`, opacity: 0 },
      ], { duration: 650 + Math.random() * 250, easing: 'ease-out' });
      anim.onfinish = () => el.remove();
    }
  }

  function floatText(x, y, text, color) {
    const el = document.createElement('div');
    el.className = 'particle';
    el.style.fontWeight = '800';
    el.style.fontSize = '16px';
    el.style.color = color;
    el.textContent = text;
    playfield.appendChild(el);
    el.style.transform = `translate(${x}px, ${y}px)`;
    const anim = el.animate([
      { transform: `translate(${x}px, ${y}px)`, opacity: 1 },
      { transform: `translate(${x}px, ${y - 46}px)`, opacity: 0 },
    ], { duration: 700, easing: 'ease-out' });
    anim.onfinish = () => el.remove();
  }

  let lastTime = 0;
  function loop(ts) {
    if (!lastTime) lastTime = ts;
    const dt = Math.min((ts - lastTime) / 1000, 0.05);
    lastTime = ts;

    if (running) update(dt);
    render();

    requestAnimationFrame(loop);
  }

  function update(dt) {
    elapsed += dt;

    // difficulty ramp
    spawnInterval = Math.max(0.28, 0.95 - elapsed * 0.015);
    fallSpeed = 150 + elapsed * 8;

    // keep the toilet pinned just above the control bar even if the bar's
    // measured height changes (e.g. a delayed viewport re-measure)
    player.y = H - BAR_H - player.h - 14;

    // player follows drag with smoothing
    player.targetX = dragX;
    player.x += (player.targetX - player.x) * Math.min(1, dt * 12);
    player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x));

    // spawn
    spawnTimer += dt;
    if (spawnTimer >= spawnInterval) {
      spawnTimer = 0;
      spawnItem();
    }

    // combo timer decay
    if (comboTimer > 0) {
      comboTimer -= dt;
      if (comboTimer <= 0) combo = 0;
    }

    // update items
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.y += it.vy * dt;
      it.rot += it.vr * dt;

      const px = player.x, py = player.y;
      const halfW = player.w / 2;
      const caught =
        it.y + it.size * 0.3 >= py &&
        it.y - it.size * 0.3 <= py + player.h &&
        it.x >= px - halfW && it.x <= px + halfW;

      if (caught) {
        it.el.remove();
        items.splice(i, 1);
        if (it.def.bad) {
          lives -= 1;
          combo = 0;
          comboTimer = 0;
          burst(it.x, it.y, '🦠', 6);
          floatText(it.x, it.y - 10, '-1', '#ff6b6b');
          if (navigator.vibrate) navigator.vibrate(80);
          updateHud();
          if (lives <= 0) return gameOver();
        } else {
          if (it.def.heal && lives < 3) {
            lives += 1;
            updateHud();
          }
          combo += 1;
          comboTimer = 1.2;
          const mult = 1 + Math.floor(combo / 5) * 0.5;
          const gained = Math.round(it.def.score * mult);
          score += gained;
          burst(it.x, it.y, it.def.emoji, 5);
          floatText(it.x, it.y - 10, '+' + gained + (combo >= 5 ? ' 🔥x' + (1 + Math.floor(combo/5)*0.5) : ''), '#ffe066');
          updateHud();
        }
        continue;
      }

      if (it.y - it.size > H - BAR_H + 20) {
        it.el.remove();
        items.splice(i, 1);
        if (!it.def.bad) {
          combo = 0;
          comboTimer = 0;
        }
      }
    }
  }

  function render() {
    for (const it of items) {
      const half = it.size / 2;
      it.el.style.transform =
        `translate(${it.x - half}px, ${it.y - half}px) rotate(${it.rot}rad)`;
    }

    playerEl.style.transform = `translate(${player.x - player.w / 2}px, ${player.y}px)`;

    if (combo >= 3) {
      comboEl.textContent = 'Combo x' + combo;
      comboEl.style.transform = `translate(${player.x}px, ${player.y - 10}px)`;
    } else {
      comboEl.textContent = '';
    }

    // keep the bottom-bar handle in sync with the toilet's position
    controlThumb.style.left = player.x + 'px';
  }

  function gameOver() {
    running = false;
    finalScoreEl.textContent = score;
    if (score > best) {
      best = score;
      localStorage.setItem(BEST_KEY, String(best));
      newBestEl.textContent = '🎉 New best score!';
      bestEl.textContent = 'Best ' + best;
    } else {
      newBestEl.textContent = 'Best score ' + best;
    }
    overScreen.classList.remove('hidden');
  }

  function startGame() {
    startScreen.classList.add('hidden');
    overScreen.classList.add('hidden');
    resetGame();
  }

  startBtn.addEventListener('click', startGame);
  retryBtn.addEventListener('click', startGame);

  function pointerToX(clientX) {
    const rect = stage.getBoundingClientRect();
    return clientX - rect.left;
  }

  // Movement is controlled from the bottom bar only, so a dragging finger
  // never covers the toilet sprite up in the play field. Pointer capture
  // keeps the drag tracking even if the finger wanders slightly off the
  // bar's narrow strip, which is what real thumbs do in one-handed use.
  let activePointerId = null;
  controlBar.addEventListener('pointerdown', (e) => {
    dragX = pointerToX(e.clientX);
    activePointerId = e.pointerId;
    if (controlBar.setPointerCapture) {
      try { controlBar.setPointerCapture(e.pointerId); } catch (err) {}
    }
    e.preventDefault();
  });
  controlBar.addEventListener('pointermove', (e) => {
    if (activePointerId !== null && e.pointerId !== activePointerId) return;
    if (activePointerId !== null || e.buttons > 0 || e.pointerType === 'touch') {
      dragX = pointerToX(e.clientX);
      e.preventDefault();
    }
  });
  function releasePointer(e) {
    if (e.pointerId === activePointerId) activePointerId = null;
  }
  controlBar.addEventListener('pointerup', releasePointer);
  controlBar.addEventListener('pointercancel', releasePointer);

  // Fallback for environments where Pointer Events behave inconsistently
  // (older Android WebViews embedded in apps, some itch.io app wrappers).
  controlBar.addEventListener('touchstart', (e) => {
    if (e.touches[0]) dragX = pointerToX(e.touches[0].clientX);
    e.preventDefault();
  }, { passive: false });
  controlBar.addEventListener('touchmove', (e) => {
    if (e.touches[0]) dragX = pointerToX(e.touches[0].clientX);
    e.preventDefault();
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    if (!running) return;
    if (e.key === 'ArrowLeft' || e.key === 'a') dragX = Math.max(0, dragX - 30);
    if (e.key === 'ArrowRight' || e.key === 'd') dragX = Math.min(W, dragX + 30);
  });

  // init idle state so the field isn't blank behind the start screen
  player = { x: W / 2, y: H - BAR_H - 64, w: 62, h: 46 };
  items = [];
  dragX = player.x;
  render();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
