<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="screen-orientation" content="portrait" />
<meta name="x5-orientation" content="portrait" />
<title>💩 Poop Catch</title>
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #2b2140;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    touch-action: none;
    user-select: none;
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* Force a portrait layout even if the device is physically rotated to
     landscape (common on Android when auto-rotate is on). Rotates the
     whole page -90deg and re-maps the viewport so it still fills the
     screen as portrait, without needing the Fullscreen/Orientation APIs. */
  @media screen and (orientation: landscape) {
    html {
      transform: rotate(-90deg);
      transform-origin: left top;
      width: 100vh;
      height: 100vw;
      overflow: hidden;
      position: absolute;
      top: 100%;
      left: 0;
    }
  }
  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 560px;
    margin: 0 auto;
    background: linear-gradient(180deg, #4b3b74 0%, #2f2450 60%, #1f1836 100%);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px 0;
    pointer-events: none;
    z-index: 5;
  }
  #score {
    color: #fff;
    font-size: 22px;
    font-weight: 800;
    text-shadow: 0 2px 4px rgba(0,0,0,.4);
  }
  #best {
    color: #ffd66b;
    font-size: 13px;
    font-weight: 600;
    margin-top: 2px;
  }
  #lives {
    font-size: 22px;
    letter-spacing: 2px;
    text-shadow: 0 2px 4px rgba(0,0,0,.4);
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(20, 14, 36, 0.72);
    backdrop-filter: blur(2px);
    text-align: center;
    padding: 24px;
    z-index: 10;
  }
  .hidden { display: none !important; }
  .title {
    font-size: 40px;
    line-height: 1.2;
    color: #fff;
    font-weight: 900;
    text-shadow: 0 4px 10px rgba(0,0,0,.4);
  }
  .sub {
    color: #e8def8;
    font-size: 15px;
    max-width: 320px;
    line-height: 1.6;
  }
  .bigScore {
    color: #ffd66b;
    font-size: 46px;
    font-weight: 900;
  }
  .label {
    color: #c9b8ec;
    font-size: 13px;
  }
  button {
    margin-top: 6px;
    border: none;
    outline: none;
    cursor: pointer;
    background: linear-gradient(180deg, #ffcf5c, #ffab3d);
    color: #5a3200;
    font-weight: 800;
    font-size: 18px;
    padding: 14px 34px;
    border-radius: 999px;
    box-shadow: 0 6px 0 #b6741a, 0 10px 18px rgba(0,0,0,.35);
    transition: transform .05s ease;
  }
  button:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #b6741a, 0 4px 10px rgba(0,0,0,.35);
  }
  .combo {
    position: absolute;
    color: #ffe066;
    font-weight: 900;
    font-size: 16px;
    pointer-events: none;
    z-index: 6;
    text-shadow: 0 2px 4px rgba(0,0,0,.5);
  }
  #footer-note {
    position: absolute;
    bottom: 8px;
    width: 100%;
    text-align: center;
    color: rgba(255,255,255,0.35);
    font-size: 11px;
    z-index: 5;
    pointer-events: none;
  }
  #controlBar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 92px;
    padding: 0 0 14px;
    z-index: 8;
    touch-action: none;
  }
  #controlTrack {
    position: relative;
    width: 100%;
    height: 100%;
    background: rgba(255,255,255,0.08);
    border-top: 2px solid rgba(255,255,255,0.18);
    box-sizing: border-box;
  }
  #controlThumb {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 60px;
    height: 60px;
    margin-left: -30px;
    margin-top: -30px;
    border-radius: 50%;
    background: linear-gradient(180deg, #ffcf5c, #ffab3d);
    box-shadow: 0 4px 0 #b6741a, 0 8px 14px rgba(0,0,0,.35);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c"></canvas>

    <div id="hud">
      <div>
        <div id="score">0</div>
        <div id="best">Best 0</div>
      </div>
      <div id="lives">🧻🧻🧻</div>
    </div>

    <div id="startScreen" class="overlay">
      <div class="title">💩 Poop<br/>Catch</div>
      <div class="sub">
        Catch falling <b>💩</b> with your toilet to score!<br/>
        Dodge <b>🦠 germs</b>, and grab <b>🧻</b> to heal!<br/>
        Drag the bar at the bottom to move.
      </div>
      <button id="startBtn">Start</button>
      <div class="label" id="bestLabel">Best score 0</div>
    </div>

    <div id="overScreen" class="overlay hidden">
      <div class="title" style="font-size:28px;">💩 Flushed!</div>
      <div class="bigScore" id="finalScore">0</div>
      <div class="label" id="newBest"></div>
      <button id="retryBtn">Play Again</button>
    </div>

    <div id="footer-note">Drag the bar below to move</div>

    <div id="controlBar">
      <div id="controlTrack">
        <div id="controlThumb">🚽</div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const bestLabel = document.getElementById('bestLabel');
  const livesEl = document.getElementById('lives');
  const startScreen = document.getElementById('startScreen');
  const overScreen = document.getElementById('overScreen');
  const finalScoreEl = document.getElementById('finalScore');
  const newBestEl = document.getElementById('newBest');
  const startBtn = document.getElementById('startBtn');
  const retryBtn = document.getElementById('retryBtn');
  const controlBar = document.getElementById('controlBar');
  const controlThumb = document.getElementById('controlThumb');

  const BAR_H = 92; // reserved height for the bottom control bar

  const BEST_KEY = 'poopCatchBest';
  let best = Number(localStorage.getItem(BEST_KEY) || 0);
  bestEl.textContent = 'Best ' + best;
  bestLabel.textContent = 'Best score ' + best;

  let W, H, DPR;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    W = stage.clientWidth;
    H = stage.clientHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const ITEM_TYPES = {
    poop:  { emoji: '💩', score: 10, weight: 54 },
    paper: { emoji: '🧻', score: 5,  weight: 13, heal: true },
    star:  { emoji: '⭐', score: 40, weight: 7  },
    bug:   { emoji: '🦠', score: 0,  weight: 26, bad: true },
  };
  const TYPE_LIST = Object.keys(ITEM_TYPES);

  function pickType() {
    const totalWeight = TYPE_LIST.reduce((s, k) => s + ITEM_TYPES[k].weight, 0);
    let r = Math.random() * totalWeight;
    for (const k of TYPE_LIST) {
      r -= ITEM_TYPES[k].weight;
      if (r <= 0) return k;
    }
    return TYPE_LIST[0];
  }

  let player, items, particles, score, lives, combo, comboTimer, elapsed, spawnTimer, spawnInterval, fallSpeed, running, dragX;

  function resetGame() {
    player = { x: W / 2, y: 0, w: 62, h: 46, targetX: W / 2 };
    player.y = H - BAR_H - player.h - 14;
    items = [];
    particles = [];
    score = 0;
    lives = 3;
    combo = 0;
    comboTimer = 0;
    elapsed = 0;
    spawnTimer = 0;
    spawnInterval = 0.95;
    fallSpeed = 150;
    running = true;
    dragX = player.x;
    updateHud();
  }

  function updateHud() {
    scoreEl.textContent = score;
    let heartsStr = '';
    for (let i = 0; i < 3; i++) heartsStr += i < lives ? '🧻' : '⬜';
    livesEl.textContent = heartsStr;
  }

  function spawnItem() {
    const type = pickType();
    const def = ITEM_TYPES[type];
    const size = 34 + Math.random() * 10;
    items.push({
      type, def,
      x: 24 + Math.random() * (W - 48),
      y: -size,
      size,
      vy: fallSpeed * (0.85 + Math.random() * 0.4),
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 2,
    });
  }

  function spawnParticles(x, y, emoji, count, color) {
    for (let i = 0; i < count; i++) {
      particles.push({
        x, y, emoji,
        vx: (Math.random() - 0.5) * 180,
        vy: -Math.random() * 160 - 40,
        life: 0.6 + Math.random() * 0.3,
        t: 0,
        size: 14 + Math.random() * 10,
        color,
      });
    }
  }

  function floatText(x, y, text, color) {
    particles.push({ x, y, text, vx: 0, vy: -60, life: 0.7, t: 0, isText: true, color });
  }

  let lastTime = 0;
  function loop(ts) {
    if (!lastTime) lastTime = ts;
    const dt = Math.min((ts - lastTime) / 1000, 0.05);
    lastTime = ts;

    if (running) update(dt);
    draw();

    requestAnimationFrame(loop);
  }

  function update(dt) {
    elapsed += dt;

    // difficulty ramp
    spawnInterval = Math.max(0.28, 0.95 - elapsed * 0.015);
    fallSpeed = 150 + elapsed * 8;

    // player follows drag with smoothing
    player.targetX = dragX;
    player.x += (player.targetX - player.x) * Math.min(1, dt * 12);
    player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x));

    // spawn
    spawnTimer += dt;
    if (spawnTimer >= spawnInterval) {
      spawnTimer = 0;
      spawnItem();
    }

    // combo timer decay
    if (comboTimer > 0) {
      comboTimer -= dt;
      if (comboTimer <= 0) combo = 0;
    }

    // update items
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.y += it.vy * dt;
      it.rot += it.vr * dt;

      const px = player.x, py = player.y;
      const halfW = player.w / 2;
      const caught =
        it.y + it.size * 0.3 >= py &&
        it.y - it.size * 0.3 <= py + player.h &&
        it.x >= px - halfW && it.x <= px + halfW;

      if (caught) {
        items.splice(i, 1);
        if (it.def.bad) {
          lives -= 1;
          combo = 0;
          comboTimer = 0;
          spawnParticles(it.x, it.y, '🦠', 6);
          floatText(it.x, it.y - 10, '-1', '#ff6b6b');
          if (navigator.vibrate) navigator.vibrate(80);
          updateHud();
          if (lives <= 0) return gameOver();
        } else {
          if (it.def.heal && lives < 3) {
            lives += 1;
            updateHud();
          }
          combo += 1;
          comboTimer = 1.2;
          const mult = 1 + Math.floor(combo / 5) * 0.5;
          const gained = Math.round(it.def.score * mult);
          score += gained;
          spawnParticles(it.x, it.y, it.def.emoji, 5);
          floatText(it.x, it.y - 10, '+' + gained + (combo >= 5 ? ' 🔥x' + (1 + Math.floor(combo/5)*0.5) : ''), '#ffe066');
          updateHud();
        }
        continue;
      }

      if (it.y - it.size > H + 20) {
        items.splice(i, 1);
        if (!it.def.bad) {
          combo = 0;
          comboTimer = 0;
        }
      }
    }

    // update particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.t += dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 260 * dt;
      if (p.t >= p.life) particles.splice(i, 1);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // floor tile line
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    for (let y = 0; y < H; y += 40) {
      ctx.fillRect(0, y, W, 1);
    }

    // items
    for (const it of items) {
      ctx.save();
      ctx.translate(it.x, it.y);
      ctx.rotate(it.rot);
      ctx.font = it.size + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(it.def.emoji, 0, 0);
      ctx.restore();
    }

    // particles
    for (const p of particles) {
      const a = 1 - p.t / p.life;
      ctx.globalAlpha = Math.max(a, 0);
      if (p.isText) {
        ctx.fillStyle = p.color;
        ctx.font = '800 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(p.text, p.x, p.y);
      } else {
        ctx.font = p.size + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(p.emoji, p.x, p.y);
      }
      ctx.globalAlpha = 1;
    }

    // player (toilet)
    ctx.save();
    ctx.translate(player.x, player.y + player.h / 2);
    ctx.font = '48px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🚽', 0, 0);
    ctx.restore();

    // combo indicator
    if (combo >= 3) {
      ctx.fillStyle = '#ffe066';
      ctx.font = '800 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Combo x' + combo, player.x, player.y - 10);
    }

    // keep the bottom-bar handle in sync with the toilet's position
    controlThumb.style.left = player.x + 'px';
  }

  function gameOver() {
    running = false;
    finalScoreEl.textContent = score;
    if (score > best) {
      best = score;
      localStorage.setItem(BEST_KEY, String(best));
      newBestEl.textContent = '🎉 New best score!';
      bestEl.textContent = 'Best ' + best;
    } else {
      newBestEl.textContent = 'Best score ' + best;
    }
    overScreen.classList.remove('hidden');
  }

  function startGame() {
    startScreen.classList.add('hidden');
    overScreen.classList.add('hidden');
    resetGame();
  }

  startBtn.addEventListener('click', startGame);
  retryBtn.addEventListener('click', startGame);

  function pointerToX(clientX) {
    const rect = stage.getBoundingClientRect();
    return clientX - rect.left;
  }

  // Movement is controlled from the bottom bar only, so a dragging finger
  // never covers the toilet sprite up in the play field.
  controlBar.addEventListener('pointerdown', (e) => {
    dragX = pointerToX(e.clientX);
    e.preventDefault();
  });
  controlBar.addEventListener('pointermove', (e) => {
    if (e.buttons > 0 || e.pointerType === 'touch') {
      dragX = pointerToX(e.clientX);
      e.preventDefault();
    }
  });

  window.addEventListener('keydown', (e) => {
    if (!running) return;
    if (e.key === 'ArrowLeft' || e.key === 'a') dragX = Math.max(0, dragX - 30);
    if (e.key === 'ArrowRight' || e.key === 'd') dragX = Math.min(W, dragX + 30);
  });

  // init idle state so canvas isn't blank behind start screen
  player = { x: W / 2, y: H - BAR_H - 64, w: 62, h: 46 };
  items = [];
  particles = [];
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
