<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:500px; height:500px; overflow:hidden; }
  body {
    font-family: 'Liberation Sans', Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 35% 30%, #FDE9F0, #F3E9FB 55%, #E3F3EC 100%);
    position: relative;
  }
  .ring {
    position:absolute; top:20px; left:20px; width:460px; height:460px;
    border-radius:50%; border: 6px solid rgba(255,255,255,.65);
  }
  .content {
    position:absolute; top:0; left:0; width:500px; height:500px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .mark {
    font-size:64px; line-height:1;
  }
  .word {
    font-family: Georgia, 'Liberation Serif', serif;
    font-size:110px; font-weight:bold; color:#4A4A4A; letter-spacing:2px;
    margin-top:6px;
  }
  .sub {
    font-size:26px; letter-spacing:5px; color:#B8779A; font-weight:bold; margin-top:10px;
  }
</style></head>
<body>
  <div class="ring"></div>
  <div class="content">
    <div class="mark">🌙✨</div>
    <div class="word">LM</div>
    <div class="sub">CO.</div>
  </div>
</body></html>
