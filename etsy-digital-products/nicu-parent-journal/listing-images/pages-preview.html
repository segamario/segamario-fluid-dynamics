<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:2000px; height:2000px; overflow:hidden; }
  body {
    font-family: 'Liberation Sans', Helvetica, Arial, sans-serif;
    background: #FFFFFF;
    position: relative;
  }
  .blob { position:absolute; border-radius:50%; opacity:.5; }
  .b1 { width:400px; height:400px; background:#D7E1EC; top:-140px; right:-120px; }
  .b2 { width:340px; height:340px; background:#E3D2D8; bottom:-120px; left:-100px; }

  .eyebrow { position:absolute; top:100px; left:0; right:0; text-align:center; font-size:20px; letter-spacing:5px; color:#A9C7B0; font-weight:600; }
  .title { position:absolute; top:142px; left:0; right:0; text-align:center; font-family:Georgia,'Liberation Serif',serif; font-size:66px; color:#454045; font-weight:bold; }
  .subtitle { position:absolute; top:232px; left:0; right:0; text-align:center; font-size:25px; color:#8D8390; }

  .grid { position:absolute; top:330px; left:180px; right:180px; bottom:180px; display:grid; grid-template-columns:repeat(2,1fr); gap:44px; }
  .cell { border-radius:18px; overflow:hidden; box-shadow:0 16px 36px rgba(69,64,69,.12); border:1px solid #ECE7EE; background:#fff; }
  .cell img { width:100%; display:block; }
</style></head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="eyebrow">WHAT'S INSIDE</div>
  <div class="title">Room to Track It, and Room to Feel It</div>
  <div class="subtitle">Daily logs, questions for the care team, milestones in your own order, and space for the rest</div>

  <div class="grid">
    <div class="cell"><img src="pg_log.png"></div>
    <div class="cell"><img src="pg_milestones.png"></div>
    <div class="cell"><img src="pg_support.png"></div>
    <div class="cell"><img src="pg_cover.png"></div>
  </div>
</body></html>
